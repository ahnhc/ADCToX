# ADC design registry: the SOLE source of design features for the forward model.
#
# ClinicalTrials.gov carries none of payload / linker / DAR / isotype / target, so this
# file is hand-curated. It is also the entity-resolution spine: `aliases` is what maps a
# messy intervention string or event-group title onto an agent.
#
# DAR caveat, stated once and applying throughout: published DAR values differ between
# the FDA label, the originating paper and review articles, because stochastic
# conjugation yields a distribution and sources quote either the mean or the mode.
# `dar` is the commonly cited mean and `dar_source` says where it came from.
# `dar_confidence: low` means sources disagree by more than ~0.5.
#
# Curated 2026-10-07 against the 18 agents measured present in the CTGov AE corpus.

