# DailyMed SPL set ids for the ADCs with a US label.
#
# openFDA does NOT serve label history: `drug/label.json` returns exactly one record per
# product, carrying only the current version and effective date. DailyMed does:
#   services/v2/spls/{setid}/history.json   -> every version with its date
#   drugInfo.cfm?setid={setid}&version={n}  -> the full historical label text
#
# This is what makes a *dated* prediction target possible. Everything else in the project
# measures consistency with warnings that already existed; a warning added to a label
# years after approval is the only genuinely anticipatory target in the public record.
#
# Also note: openFDA label lookups must search `openfda.brand_name`. Searching
# `generic_name` returns only a minority of these products.

