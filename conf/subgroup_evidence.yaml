evidence:
- id: tdxd_fda19_renal_mod_ild
  adc: trastuzumab-deruxtecan
  source_type: fda_review
  source_title: BLA 761139 ENHERTU Multi-disciplinary Review and Evaluation (original approval, Dec 2019)
  source_url: https://www.accessdata.fda.gov/drugsatfda_docs/nda/2019/761139Orig1s000MultidisciplineR.pdf
  source_year: 2019
  local_text: /data/hyeongchanahn/adctox/raw/subgroup_sources/trastuzumab-deruxtecan__fda-multidiscipline-review-2019.txt
  basis: label_basis
  population: HER2-positive Breast Cancer 5.4 mg/kg Pool (N=234; studies DS8201-A-J101 and DS8201-A-U201), T-DXd 5.4 mg/kg q3w, HER2+ metastatic breast cancer
  characteristic: crcl
  exposed:
    label: moderate renal impairment (CrCl 30-<60)
    n: 29
    events: 7
    pct: 24.1
    patient:
      crcl: 45
  reference:
    label: normal renal function (CrCl >=90)
    n: 113
    events: 6
    pct: 5.3
    patient:
      crcl: 100
  hr: null
  outcome: ILD events (adjudicated ILD pool term, any grade)
  outcome_rank: 3
  quote: In the HER2-positive Breast Cancer 5.4 mg/kg Pool, 113 subjects entered the study with normal renal function, 91 with mild impairment, 29 with moderate impairment, and 1 with severe impairment.
    No subject entered the study with end-stage renal disease. In the HER2-positive Breast Cancer 5.4 mg/kg Pool, a higher proportion of subjects with moderate renal impairment at baseline (6 [20.7%]) had
    an action taken of study drug discontinuation for TEAEs than subjects with normal renal function at baseline (8 [7.1%]) or mild renal impairment (7 [7.7%]). This difference was driven primarily by the
    frequency of ILD among the groups. In the HER2-positive Breast Cancer 5.4 mg/kg Pool, a higher proportion of subjects with moderate renal impairment at baseline (7 [24.1%] subjects) had ILD events compared
    to subjects with normal renal function (6 [5.3%]) or mild renal impairment (7 [7.7%]) at baseline.
  notes: Section 'Renal Function at Baseline' (safety by intrinsic factors), approx. line 9920 of txt, review p.201-202. Renal categories by Cockcroft-Gault CrCl (normal >=90, mild 60-<90, moderate 30-<60).
    Stratum n stated in the same paragraph; 1 subject with severe impairment not contrasted.
  ocr: false
