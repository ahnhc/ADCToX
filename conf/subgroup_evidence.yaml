      ugt1a1_28_homozygous: false
  hr: null
  outcome: grade>=2 AE (first three cycles)
  outcome_rank: 3
  quote: The analysis of SG-related toxicity stratified by UGT1A1*28 genotype showed that 100% of HomoMut patients developed grade ≥ 2 AEs during the first three cycles, compared to 69% of WT + HET genotype
    patients (p = 0.109) (Figure 2). No significant differences were observed in the incidence of grade ≥ 2 neutropenia (HomoMut 17% versus WT + HET 33%; p = 0.400). However, the incidence of grade ≥ 2
    febrile neutropenia was significantly higher in the HomoMut genotype group compared to the rest of the patients (33% versus 7%; p = 0.025).
  notes: Results, line 63. Stratum n from Table 1 header 'WT + HET(N = 75) | HomoMut(N = 6)' (line ~159) and text '7.4% (N = 6)'. Reference stratum combines wild type and heterozygous. Grade>=2 any AE is
    not Grade>=3; rank 3 used.
