  source_url: https://doi.org/10.3390/jcm15020574 (PMC12842121)
  source_year: 2026
  local_text: /data/hyeongchanahn/adctox/raw/subgroup_sources/sacituzumab-govitecan__dopazo2026-jcm-ugt1a1-rw.txt
  basis: post_approval
  population: Multicentre ambispective real-world cohort, mTNBC treated with SG (full starting dose), N=81; AEs during first three cycles
  characteristic: ugt1a1
  exposed:
    label: UGT1A1*28/*28 homozygous (HomoMut)
    n: 6
    events: null
    pct: 100
    patient:
      ugt1a1_28_homozygous: true
  reference:
    label: UGT1A1 wild type + heterozygous (WT + HET)
    n: 75
