# Typed forms that stand for a registry condition (conf/comorbidity_registry.csv), read before the organ judge.
#
# The restriction rules and the curated severity attach to a patient only through a registry condition, and free text reaches
# one only when the judge's concept is listed in conf/registry_concepts.json. A form here reaches its condition directly.
#
# NEEDS CLINICIAN REVIEW before it is relied on. These forms were written by an LLM from clinical vocabulary and from the
# misses on the tune half of data/curated/registry_linking/queries.jsonl (also LLM-written, not clinician-read). No physician
# has checked which condition each form should mean. Read it as a draft.
#
# Rules for a form
#   - one exact typed form per entry, matched case-insensitively after the text is lower-cased; nothing is fuzzy here
#   - one dominant clinical meaning in a comorbidity list. A short form with several meanings is left out: MS (multiple
#     sclerosis, mitral stenosis), PE, RA, CAD, UC (ulcerative colitis, urothelial carcinoma), LC (liver cirrhosis, lung cancer),
#     CLD, DED, HD, TCP, CP, PN, DM. The judge still reads those; they link no registry condition from here.
#   - no misspellings and no numbers measured on the patient (LVEF 35% is a lab value, entered as one)
#   - a form that carries a severity (cirrhosis child pugh B) names its condition only. The Child-Pugh value stays a lab input.
#   - a form must not be a cancer name or alias in data/curated/competition/cancer_mondo.json (tests/test_registry_aliases.py)
