  - {adc: sacituzumab-govitecan, domain: renal, category: insufficient_data, section: "12.3", when: {crcl_lt: 30},
     quote: "There are no data on the pharmacokinetics of sacituzumab govitecan-hziy in patients with CLcr 15 to 29 mL/min, or end-stage renal disease (CLcr < 15 mL/min)."}
  - {adc: sacituzumab-govitecan, domain: renal, category: insufficient_data, section: "12.3", when: {esrd: true},
