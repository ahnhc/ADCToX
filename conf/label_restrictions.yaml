  - {adc: mirvetuximab-soravtansine, domain: renal, category: insufficient_data, section: "8.6", when: {crcl_lt: 30},
     quote: "The effect of severe renal impairment (CLcr 15 to < 30 mL/min) or end-stage renal disease on ELAHERE is unknown"}
  - {adc: mirvetuximab-soravtansine, domain: renal, category: insufficient_data, section: "8.6", when: {esrd: true},
