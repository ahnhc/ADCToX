  - {adc: pivekimab-sunirine, domain: renal, category: avoid, section: "8.6", when: {crcl_lt: 60},
     quote: "Avoid use of DECNUPAZ in patients with moderate to severe renal impairment (CLcr <60 mL/min, estimated by Cockcroft-Gault) or patients with end stage renal disease."}
  - {adc: pivekimab-sunirine, domain: renal, category: avoid, section: "8.6", when: {esrd: true},
     quote: "Avoid use of DECNUPAZ in patients with moderate to severe renal impairment (CLcr <60 mL/min, estimated by Cockcroft-Gault) or patients with end stage renal disease."}
  - {adc: pivekimab-sunirine, domain: renal, category: no_adjustment, section: "8.6", when: {crcl_ge: 60},
     quote: "No dosage adjustment of DECNUPAZ is recommended for patients with mild renal impairment (CLcr 60 to <90 mL/min, estimated by Cockcroft-Gault)"}
  - {adc: pivekimab-sunirine, domain: hepatic, category: avoid, section: "8.7", when: {bili_gt: 1.5},
