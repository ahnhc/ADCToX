[project]
name = "adctox"
version = "0.8.5"
description = "ADCTOX: compare approved ADCs against a patient's comorbidities and lab values using label evidence"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lxml>=5.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# ml/ (the organ judge, the name index and their training) imports torch and transformers; the floors are the
# versions releases/requirements-cpu.txt and the release build pin.
ml = ["torch>=2.11", "transformers>=5.19", "safetensors>=0.4"]
model = ["numpyro>=0.15", "jax>=0.4.35", "lightgbm>=4.5"]
api = ["fastapi>=0.115", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adctox"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
