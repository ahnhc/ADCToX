[project]
name = "adctox"
version = "1.0.2"
description = "Patient-specific ADC safety evaluation and de novo conjugate design"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lxml>=5.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# ml/ (the organ judge, the name index and their training) imports torch and transformers; the floors are the
# versions releases/requirements-cpu.txt and the release build pin.
ml = ["torch>=2.11", "transformers>=5.19", "safetensors>=0.4"]
model = ["numpyro>=0.15", "jax>=0.4.35", "lightgbm>=4.5"]
api = ["fastapi>=0.115", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adctox"]

[tool.hatch.build.targets.wheel.force-include]
"conf" = "adctox/_data/conf"
"artifacts/axis_composition.json" = "adctox/_data/artifacts/axis_composition.json"
"artifacts/dose_mod_eval.json" = "adctox/_data/artifacts/dose_mod_eval.json"
"artifacts/exclusion_enrichment_exclusion.json" = "adctox/_data/artifacts/exclusion_enrichment_exclusion.json"
"artifacts/forward_other_metrics.json" = "adctox/_data/artifacts/forward_other_metrics.json"
"artifacts/hard_flag_necessity.json" = "adctox/_data/artifacts/hard_flag_necessity.json"
"artifacts/label_change_eval.json" = "adctox/_data/artifacts/label_change_eval.json"
"artifacts/posterior_other.npz" = "adctox/_data/artifacts/posterior_other.npz"
"artifacts/posterior_serious.npz" = "adctox/_data/artifacts/posterior_serious.npz"
"artifacts/target_expression.json" = "adctox/_data/artifacts/target_expression.json"

[tool.hatch.build.targets.sdist]
include = [
    "/src/adctox",
    "/conf",
    "/artifacts/axis_composition.json",
    "/artifacts/dose_mod_eval.json",
    "/artifacts/exclusion_enrichment_exclusion.json",
    "/artifacts/forward_other_metrics.json",
    "/artifacts/hard_flag_necessity.json",
    "/artifacts/label_change_eval.json",
    "/artifacts/posterior_other.npz",
    "/artifacts/posterior_serious.npz",
    "/artifacts/target_expression.json",
    "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
