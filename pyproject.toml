[project]
name = "adctox"
version = "0.5.6"
description = "ADCTOX: compare approved ADCs against a patient's comorbidities and lab values using label evidence (research prototype)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lxml>=5.3",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
model = ["numpyro>=0.15", "jax>=0.4.35", "lightgbm>=4.5"]
chem = ["rdkit>=2024.3"]
api = ["fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adctox"]
