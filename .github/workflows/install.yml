name: One-line install
# Runs the published installers exactly as users do, after a release is published (or by hand).
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')    # app releases; a models-* release alone may precede its app
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, uv: '0'}
          - {os: ubuntu-22.04, uv: '1'}       # Python 3.10 only: the installer fetches Python 3.12 with uv
          - {os: macos-15, uv: '0'}           # Apple silicon; macOS 14 images retire in November 2026
          - {os: macos-15, uv: '1'}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install with the one-line command
        shell: bash          # the default shell has no pipefail: a failed curl would pass
        env:
          ADCTOX_FORCE_UV: ${{ matrix.uv }}
        run: curl -fsSL https://raw.githubusercontent.com/ahnhc/ADCToX/main/install.sh | bash
      - name: Run the installed app
        shell: bash          # pipefail, so a failing --self-test cannot hide behind tee
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          got=$(adctox --version)
          echo "$got"
          if [ "$EVENT" = release ] && [ "$got" != "${TAG#v}" ]; then echo "installed $got, release tag $TAG"; exit 1; fi
          adctox --self-test | tee out.txt
          grep -q ADC out.txt
          test -x "$HOME/.local/bin/adctox-cli" && grep -q -- '--cli "\$@"' "$HOME/.local/bin/adctox-cli"

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      - name: Install with the one-line command
        shell: pwsh
        run: irm https://raw.githubusercontent.com/ahnhc/ADCToX/main/install.ps1 | iex
      - name: Run the installed app
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'adctox\app'
          $got = (& "$app\python\python.exe" -I "$app\launcher.py" --version | Out-String).Trim()
          $got
          if ($env:EVENT -eq 'release' -and $got -ne $env:TAG.TrimStart('v')) { throw "installed $got, release tag $env:TAG" }
          & "$app\python\python.exe" -I "$app\launcher.py" --self-test | Tee-Object out.txt
          if ($LASTEXITCODE -ne 0) { throw "self-test failed ($LASTEXITCODE)" }
          if (-not (Select-String -Path out.txt -Pattern "ADC" -Quiet)) { throw "no recommendation table" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'adctox\bin\adctox.cmd'))) { throw "adctox command missing" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'adctox\bin\adctox-cli.cmd'))) { throw "adctox-cli command missing" }
      - name: Open the browser page
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'adctox\app'
          $env:ADCTOX_NO_BROWSER = '1'
          $p = Start-Process -FilePath "$app\python\python.exe" -ArgumentList '-I', "$app\launcher.py", '--web' -RedirectStandardOutput web.out -RedirectStandardError web.err -PassThru -NoNewWindow
          $url = $null
          for ($i = 0; $i -lt 90 -and -not $url; $i++) {
            Start-Sleep 2
            $m = Select-String -Path web.out, web.err -Pattern 'http://127\.0\.0\.1:\d+' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($m) { $url = $m.Matches[0].Value }
            if ($p.HasExited) { break }
          }
          Get-Content web.out, web.err -ErrorAction SilentlyContinue
          if (-not $url) { throw "the web server printed no address (exit: $($p.HasExited) $($p.ExitCode))" }
          foreach ($path in '/', '/static/app.css', '/static/app.js', '/static/AnthropicSansText-Light.otf', '/static/PretendardVariable.woff2') {
            $r = Invoke-WebRequest -UseBasicParsing "$url$path"
            "$path $($r.StatusCode) $($r.Headers['Content-Type']) $($r.RawContentLength)"
          }
          $r = Invoke-WebRequest -UseBasicParsing "$url/api/suggest?q=cirrhosis"
          "/api/suggest $($r.StatusCode) $($r.Content.Substring(0, [Math]::Min(200, $r.Content.Length)))"
          if ($r.Content -notmatch 'irrhosis') { throw "no suggestion for cirrhosis" }
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          & $edge --headless=new --disable-gpu --virtual-time-budget=8000 --window-size=1440,900 --screenshot="$PWD\web.png" $url | Out-Null
          $dom = & $edge --headless=new --disable-gpu --virtual-time-budget=8000 --dump-dom $url | Out-String
          "DOM: $($dom.Length) chars, crumbs: $($dom -match 'class=`"crumbs`"'), search: $($dom -match 'Condition, symptom or cancer')"
          Get-Content web.out, web.err -ErrorAction SilentlyContinue | Select-Object -Last 20
          Stop-Process -Id $p.Id -Force
          if ($dom -notmatch 'class="crumbs"') { $dom.Substring(0, [Math]::Min(3000, $dom.Length)); throw "Edge did not draw the page" }
      - name: Keep the page screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-web
          path: web.png
          if-no-files-found: ignore
