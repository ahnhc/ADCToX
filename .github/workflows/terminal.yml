name: Ubuntu terminal
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    # The whole of tests/, so test_webapp.py, test_web_ui.py and the rest are enforced and
    # not only the files the other jobs name. torch is not installed: test_rerank.py skips
    # itself without it, so it is listed nowhere else.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Tools the tests shell out to
        run: make --version && git --version && node --version
      - run: python -m pip install pytest numpy pandas pyarrow scipy scikit-learn pyyaml lxml httpx fastapi pydantic numpyro jax lightgbm
      - run: python -m pytest tests -q

  encoding:
    # A text open without encoding= follows the locale, which is cp1252 on Windows and
    # corrupts the Korean strings this app reads.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.3
      - run: ruff check ml src scripts tests --preview --select PLW1514

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy pandas scipy pyyaml lxml
      - run: python -m pytest tests/test_model_updates.py tests/test_terminal_layout.py tests/test_ml_recommender.py tests/test_team_sheets.py tests/test_suggest.py -k 'not full_build' -q
      - run: bash -n install.sh
      - name: Build the app from factual label evidence
        env:
          ADCTOX_EVIDENCE_SNAPSHOT: ml/data/label_evidence.json
        run: |
          python -I scripts/build_ubuntu_release.py --out dist/ci-release
          python -I dist/ci-release/app/adc_recommender_full.py --version
          python -I dist/ci-release/app/adc_recommender_full.py --help

  macos:
    runs-on: macos-15    # Apple silicon, as macos-14 was; the 14 images retire in November 2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy pandas scipy pyyaml lxml
      - run: python -m pytest tests/test_model_updates.py tests/test_terminal_layout.py tests/test_suggest.py -k 'not full_build' -q
      - run: bash -n install.sh && /bin/bash -n install.sh        # macOS ships bash 3.2
      - name: Build and start the app on macOS
        env:
          ADCTOX_EVIDENCE_SNAPSHOT: ml/data/label_evidence.json
        run: |
          python -I scripts/build_ubuntu_release.py --out dist/ci-release
          python -I dist/ci-release/app/adc_recommender_full.py --version

  windows-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scipy pyyaml lxml uv
      - name: Build the app and the Windows package
        env:
          ADCTOX_EVIDENCE_SNAPSHOT: ml/data/label_evidence.json
          ADCTOX_WIN_CACHE: ${{ runner.temp }}/win-cache
        run: |
          python -I scripts/build_ubuntu_release.py --out dist/releases
          python -I scripts/build_windows_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: adctox-windows
          path: dist/releases/windows/ADCTOX-windows.zip
          retention-days: 7

  windows-smoke:
    needs: windows-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Updater on real Windows (current.txt switch, msvcrt lock, file replace semantics)
        run: |
          python -m pip install pytest numpy pandas scipy pyyaml lxml
          python -m pytest tests/test_model_updates.py -q
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: adctox-windows
      - name: Unzip and run the package as a user would (no system Python involved)
        shell: pwsh
        env:
          ADC_MODEL_HOME: ${{ runner.temp }}\adctox-models
        run: |
          Expand-Archive ADCTOX-windows.zip -DestinationPath pkg
          $py = "pkg\ADCTOX\python\python.exe"
          & $py -I pkg\ADCTOX\launcher.py --version
          & $py -I pkg\ADCTOX\launcher.py --help
          & $py -I pkg\ADCTOX\launcher.py --update-models
          if ($LASTEXITCODE -ne 0) { throw "model download failed" }
          & $py -I pkg\ADCTOX\launcher.py --self-test | Tee-Object out.txt
          if ($LASTEXITCODE -ne 0) { throw "self-test failed ($LASTEXITCODE)" }
          if (-not (Select-String -Path out.txt -Pattern "ADC" -Quiet)) { throw "no recommendation table" }
