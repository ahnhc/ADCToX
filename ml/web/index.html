<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ADCToX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111111'/%3E%3Cpath d='M9 22L14.2 10H17.8L23 22H19.8L18.7 19.2H13.3L12.2 22H9ZM14.3 16.6H17.7L16 12.2L14.3 16.6Z' fill='%23FFFFFF'/%3E%3Ccircle cx='23.5' cy='10.5' r='2.2' fill='%230D9488'/%3E%3C/svg%3E">
<script>
(function () {
  var q = location.search, file = location.protocol === "file:", base = file ? "" : "/static/";
  var mock = file && /[?&]mock=1(&|$)/.test(q);
  window.ADCTOX_FILE_MOCK = mock;
  if (mock && /[?&]motion=0(&|$)/.test(q)) document.documentElement.classList.add("still");
  window.ADCTOX_BASE = base;
  if (!file) {
    document.write('<link rel="manifest" href="' + base + 'manifest.webmanifest">');
    document.write('<link rel="apple-touch-icon" href="' + base + 'icon.svg">');
  }
  window.ADCTOX_RETRY = function () {
    var n = 0;
    try { n = +sessionStorage.getItem("adctoxReload") || 0; sessionStorage.setItem("adctoxReload", n + 1); } catch (e) { n = 3; }
    if (n < 3) location.reload();
    else document.documentElement.innerHTML = "<body><p>ADCToX could not load its page files. If a filter or antivirus inspects local traffic, exclude this program from it, then reload.</p></body>";
  };
  document.write('<link rel="stylesheet" href="' + base + 'app.css" onerror="ADCTOX_RETRY()">');
})();
</script>
</head>
<body>
<noscript>ADCToX needs JavaScript.</noscript>
<script>
(function () {
  var base = window.ADCTOX_BASE;
  if (window.ADCTOX_FILE_MOCK) document.write('<script src="' + base + 'mock.js"><\/script>');
  document.write('<script src="' + base + 'surrogate_2592.js"><\/script>');
  document.write('<script src="' + base + 'review.js"><\/script>');
  document.write('<script src="' + base + 'app.js" onerror="ADCTOX_RETRY()"><\/script>');
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
